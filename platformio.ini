; META TV 1.1.10
; Cardputer ADV. Same IR catalog as 1.0.5, plus local Wi-Fi TV control.
; Cardputer ADV, Stamp-S3A, ESP32-S3FN8, 8 MB, sin PSRAM.

[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; Stamp-S3A: flash QIO y sin PSRAM OPI. qio_opi (el default de algunas boards) no arranca.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
board_build.embed_txtfiles = wifi.txt
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCARDPUTER_ADV=1
    -DIR_BLADE_TX_PIN=44
    -DCORE_DEBUG_LEVEL=0
    -Os
    -D_IR_ENABLE_DEFAULT_=false
    -DSEND_RAW=true
    -DSEND_NEC=true
    -DSEND_SAMSUNG=true
    -DSEND_SONY=true
    -DSEND_RC5=true
    -DSEND_RC6=true
    -DSEND_PANASONIC=true
    -DSEND_JVC=true
    -DSEND_PIONEER=true
    -DSEND_SHARP=true
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    crankyoldgit/IRremoteESP8266@^2.8.6
