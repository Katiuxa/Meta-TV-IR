; IR-Blade — M5Stack Cardputer ADV (Stamp-S3A, ESP32-S3FN8, 8 MB flash, sin PSRAM)
; El .bin de aplicacion (firmware.bin) se copia a la microSD y se instala desde M5Launcher.

[platformio]
default_envs = cardputer-adv
src_dir = src

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; Stamp-S3A: flash QIO y sin PSRAM OPI. qio_opi (el default de algunas boards) no arranca.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCARDPUTER_ADV=1
    -DIR_BLADE_TX_PIN=44
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    crankyoldgit/IRremoteESP8266@^2.8.6
